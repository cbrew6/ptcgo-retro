# `python -m unittest discover -s tests` is the canonical runner; this file only
# makes a bare `pytest` work too.
#
# seleniumbase installs a pytest plugin that is autoloaded into every pytest run
# on this machine. It imports `requests`, which imports urllib3, which reads
# SSLKEYLOGFILE at import time and dies with PermissionError because that
# variable is inherited from the shell and points at a file held open elsewhere.
# The failure happens during plugin loading, before conftest.py can clear the
# variable, so the plugin has to be refused rather than worked around.
[pytest]
testpaths = tests
addopts = -p no:seleniumbase -p no:cacheprovider
